[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platelog"
version = "0.1.0"
description = "Detect trucks in video clips and log their license plates with real clock times."
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
platelog = "platelog:main"

[tool.setuptools]
py-modules = ["platelog"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["."]
